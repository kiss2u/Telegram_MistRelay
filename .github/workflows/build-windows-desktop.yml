name: Build Windows Desktop

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release metadata
        id: meta
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#desktop-v}"
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version in tag: ${TAG_NAME}"
            exit 1
          fi

          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          {
            echo "tag_name=${TAG_NAME}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "artifact_name=mistrelay-windows-v${VERSION}"
            echo "release_name=MistRelay Desktop v${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Validate updater public key
        shell: bash
        run: |
          node <<'SCRIPT'
          const fs = require('fs')
          const path = require('path')

          const tauriConfigPath = path.join(process.cwd(), 'desktop', 'tauri.conf.json')
          const config = JSON.parse(fs.readFileSync(tauriConfigPath, 'utf8'))
          const pubkey = config?.plugins?.updater?.pubkey

          if (typeof pubkey !== 'string' || !pubkey.trim()) {
            console.error('ERROR: desktop/tauri.conf.json is missing plugins.updater.pubkey')
            process.exit(1)
          }

          const normalized = pubkey.trim()
          if (!/^[A-Za-z0-9+/=]+$/.test(normalized)) {
            console.error('ERROR: updater pubkey must be the base64 content of the generated .pub key file.')
            process.exit(1)
          }

          let decoded
          try {
            decoded = Buffer.from(normalized, 'base64').toString('utf8')
          } catch (error) {
            console.error(`ERROR: updater pubkey failed to decode from base64: ${error.message}`)
            process.exit(1)
          }

          const lines = decoded.trim().split(/\r?\n/).filter(Boolean)
          if (lines.length !== 2 || !lines[0].startsWith('untrusted comment: minisign public key:')) {
            console.error('ERROR: updater pubkey must decode to the two-line minisign public key content.')
            process.exit(1)
          }

          if (!/^[A-Za-z0-9+/=]+$/.test(lines[1])) {
            console.error('ERROR: updater pubkey payload is not a valid minisign key line.')
            process.exit(1)
          }
          SCRIPT

      - name: Validate signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          SANITIZED_KEY="$(printf '%s' "${SIGNING_KEY}" | tr -d '[:space:]')"

          if [[ -z "${SANITIZED_KEY}" ]]; then
            echo "ERROR: missing TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          fi

          export SANITIZED_KEY
          node <<'SCRIPT'
          const key = process.env.SANITIZED_KEY || ''
          if (!/^[A-Za-z0-9+/=]+$/.test(key)) {
            console.error('ERROR: TAURI_SIGNING_PRIVATE_KEY is not valid base64 after whitespace removal.')
            console.error('It must be the private key file content generated by `tauri signer generate`, not the public key or a path.')
            process.exit(1)
          }

          try {
            Buffer.from(key, 'base64')
          } catch (error) {
            console.error(`ERROR: failed to decode TAURI_SIGNING_PRIVATE_KEY: ${error.message}`)
            process.exit(1)
          }
          SCRIPT

          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__SIGNING_EOF__"
            echo "${SANITIZED_KEY}"
            echo "__SIGNING_EOF__"
          } >> "${GITHUB_ENV}"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "${GITHUB_ENV}"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
          cache-on-failure: true

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Sync desktop app version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node <<'SCRIPT'
          const fs = require('fs')
          const path = require('path')

          const version = process.env.RELEASE_VERSION
          const cargoTomlPath = path.join(process.cwd(), 'desktop', 'Cargo.toml')
          const tauriConfigPath = path.join(process.cwd(), 'desktop', 'tauri.conf.json')

          const cargoToml = fs.readFileSync(cargoTomlPath, 'utf8').replace(
            /^version = ".*"$/m,
            `version = "${version}"`,
          )
          fs.writeFileSync(cargoTomlPath, cargoToml)

          const tauriConfig = JSON.parse(fs.readFileSync(tauriConfigPath, 'utf8'))
          tauriConfig.version = version
          fs.writeFileSync(tauriConfigPath, `${JSON.stringify(tauriConfig, null, 2)}\n`)
          SCRIPT

      - name: Build Windows desktop client
        working-directory: desktop
        run: npm run build -- --bundles nsis

      - name: Generate latest.json for updater
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          NSIS_DIR="desktop/target/release/bundle/nsis"

          SETUP_EXE=$(ls "${NSIS_DIR}"/*-setup.exe 2>/dev/null | head -1)
          SETUP_SIG=$(ls "${NSIS_DIR}"/*-setup.exe.sig 2>/dev/null | head -1)

          if [[ -z "${SETUP_EXE}" || -z "${SETUP_SIG}" ]]; then
            echo "ERROR: could not find NSIS setup exe or signature file"
            ls -la "${NSIS_DIR}"/
            exit 1
          fi

          EXE_NAME=$(basename "${SETUP_EXE}")
          SIG_CONTENT=$(cat "${SETUP_SIG}")
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${EXE_NAME}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG_NAME}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          export RELEASE_VERSION SIG_CONTENT DOWNLOAD_URL RELEASE_URL PUB_DATE
          node <<'SCRIPT'
          const fs = require('fs')

          const payload = {
            version: process.env.RELEASE_VERSION,
            notes: `MistRelay Desktop v${process.env.RELEASE_VERSION}\n如果自动更新不可用，请手动下载安装包：${process.env.DOWNLOAD_URL}\nRelease 页面：${process.env.RELEASE_URL}`,
            pub_date: process.env.PUB_DATE,
            platforms: {
              'windows-x86_64': {
                signature: process.env.SIG_CONTENT,
                url: process.env.DOWNLOAD_URL,
              },
            },
          }

          fs.writeFileSync('latest.json', `${JSON.stringify(payload, null, 2)}\n`)
          SCRIPT

          echo "--- latest.json ---"
          cat latest.json

      - name: Verify updater bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          NSIS_DIR="desktop/target/release/bundle/nsis"

          SETUP_EXE=$(ls "${NSIS_DIR}"/*-setup.exe 2>/dev/null | head -1)
          SETUP_SIG=$(ls "${NSIS_DIR}"/*-setup.exe.sig 2>/dev/null | head -1)

          if [[ -z "${SETUP_EXE}" || -z "${SETUP_SIG}" ]]; then
            echo "ERROR: could not find NSIS setup exe or signature file"
            ls -la "${NSIS_DIR}"/
            exit 1
          fi

          cargo run --quiet --locked --manifest-path desktop/Cargo.toml --bin verify_updater_bundle -- \
            --tauri-config desktop/tauri.conf.json \
            --manifest latest.json \
            --installer "${SETUP_EXE}" \
            --signature "${SETUP_SIG}" \
            --version "${RELEASE_VERSION}" \
            --tag "${TAG_NAME}" \
            --repo "${REPO}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            desktop/target/release/bundle/nsis/*
            latest.json
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          make_latest: true
          files: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/nsis/*.exe.sig
            latest.json
